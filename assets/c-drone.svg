<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="GNN Drone Swarm Optimization: Decentralized spatial coordination and collision avoidance for autonomous drone swarms"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141c2e"/><stop offset=".5" stop-color="#101f3b"/><stop offset="1" stop-color="#0a1428"/></linearGradient>
<radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".38"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b3257"/></pattern>
<filter id="gw" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cl"><rect width="1000" height="300" rx="16"/></clipPath></defs>
<g clip-path="url(#cl)"><rect width="1000" height="300" fill="url(#bg)"/><rect width="1000" height="300" fill="url(#dots)" opacity=".7"/>
<ellipse cx="940" cy="0" rx="260" ry="150" fill="url(#gl)"><animate attributeName="rx" values="220;300;220" dur="6s" repeatCount="indefinite"/></ellipse>
<rect x="0" y="0" width="1000" height="3" fill="#38bdf8"/>
<rect x="-200" y="0" width="200" height="300" fill="url(#sw)" transform="skewX(-20)"><animate attributeName="x" values="-200;1300" dur="7s" repeatCount="indefinite"/></rect></g>
<rect x=".75" y=".75" width="998.5" height="298.5" rx="15.5" fill="none" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5"/>
<text x="34" y="40" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#38bdf8">GRAPH NEURAL NETWORKS &amp; ROBOTICS  /  TEAM CO-AUTHOR</text>
<text x="34" y="74" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#eaf1fb">GNN Drone Swarm Optimization</text>
<text x="470" y="73" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#b9c9e0">Decentralized multi-agent spatial coordination</text>
<rect x="908" y="16" width="68" height="22" rx="11" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".6"/><circle cx="923" cy="27" r="3.6" fill="#38bdf8"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="932" y="31" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.2" fill="#38bdf8">ACTIVE</text>
<text x="34" y="104" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">A graph neural network architecture for decentralized multi-agent drone swarm coordination and collision avoidance.</text>
<text x="34" y="125" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">Individual drones represented as dynamic graph nodes with 3D kinematic states; inter-agent radio links as dynamic edges.</text>
<text x="34" y="146" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">Edge-conditioned message passing learns distributed flight policies via multi-agent RL without a centralized bottleneck.</text>
<text x="34" y="172" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="1.6" fill="#8aa0bd">COORDINATION PIPELINE  ·  PYTORCH GEOMETRIC &amp; MARL</text>
<rect x="33" y="184" width="205" height="54" rx="12" fill="#38bdf8" fill-opacity=".10" stroke="#38bdf8" stroke-opacity=".6"/><text x="135.5" y="206" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#eaf1fb">Spatial k-NN Graph</text><text x="135.5" y="225" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8aa0bd">dynamic topology</text>
<rect x="276" y="184" width="205" height="54" rx="12" fill="#38bdf8" fill-opacity=".10" stroke="#38bdf8" stroke-opacity=".6"/><text x="378.5" y="206" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#eaf1fb">Kinematic Encoder</text><text x="378.5" y="225" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8aa0bd">pos · vel · heading</text>
<rect x="519" y="184" width="205" height="54" rx="12" fill="#a78bfa" fill-opacity=".10" stroke="#a78bfa" stroke-opacity=".6"/><text x="621.5" y="206" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#eaf1fb">PyG Message Passing</text><text x="621.5" y="225" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8aa0bd">relational reasoning</text>
<rect x="762" y="184" width="205" height="54" rx="12" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".6"/><text x="864.5" y="206" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#eaf1fb">Decentralized Policy</text><text x="864.5" y="225" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11" fill="#8aa0bd">MARL + C++ telemetry</text>
<path id="a0" d="M242 211.0 H272" stroke="#223a61" stroke-width="2"/><path d="M266 206.0 L273 211.0 L266 216.0" fill="none" stroke="#5f84b8" stroke-width="2"/>
<path id="a1" d="M485 211.0 H515" stroke="#223a61" stroke-width="2"/><path d="M509 206.0 L516 211.0 L509 216.0" fill="none" stroke="#5f84b8" stroke-width="2"/>
<path id="a2" d="M728 211.0 H758" stroke="#223a61" stroke-width="2"/><path d="M752 206.0 L759 211.0 L752 216.0" fill="none" stroke="#5f84b8" stroke-width="2"/>
<circle r="3.4" fill="#38bdf8" filter="url(#gw)"><animateMotion dur="1.8s" begin="0.0s" repeatCount="indefinite"><mpath href="#a0"/></animateMotion></circle>
<circle r="3.4" fill="#a78bfa" filter="url(#gw)"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
<circle r="3.4" fill="#34d399" filter="url(#gw)"><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
<rect x="34" y="256" width="130" height="24" rx="12" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="99" y="272" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">PyTorch Geometric</text>
<rect x="172" y="256" width="60" height="24" rx="12" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="202" y="272" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">GNN</text>
<rect x="240" y="256" width="125" height="24" rx="12" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="302" y="272" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Message Passing</text>
<rect x="373" y="256" width="115" height="24" rx="12" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="430" y="272" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Multi-Agent RL</text>
<rect x="496" y="256" width="70" height="24" rx="12" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="531" y="272" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">C++ 17</text>
<rect x="574" y="256" width="85" height="24" rx="12" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="616" y="272" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">NetworkX</text>
</svg>
