<svg xmlns="http://www.w3.org/2000/svg" width="490" height="200" viewBox="0 0 490 200" role="img" aria-label="Linear Regression from Scratch"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101f3b"/><stop offset="1" stop-color="#0a1428"/></linearGradient>
<radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".35"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b3257"/></pattern>
<clipPath id="cl"><rect width="490" height="200" rx="16"/></clipPath></defs>
<g clip-path="url(#cl)"><rect width="490" height="200" fill="url(#bg)"/><rect width="490" height="200" fill="url(#dots)" opacity=".7"/>
<ellipse cx="450" cy="200" rx="230" ry="130" fill="url(#gl)"><animate attributeName="rx" values="200;270;200" dur="7s" repeatCount="indefinite"/></ellipse>
<rect x="0" y="0" width="490" height="3" fill="#fbbf24" opacity=".9"/>
<rect x="-200" y="0" width="200" height="200" fill="url(#sw)" transform="skewX(-20)"><animate attributeName="x" values="-200;790" dur="8s" begin="1.4s" repeatCount="indefinite"/></rect></g>
<rect x=".75" y=".75" width="488.5" height="198.5" rx="15.5" fill="none" stroke="#fbbf24" stroke-opacity=".35" stroke-width="1.5"/>
<text x="34" y="40" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#fbbf24">ML FROM SCRATCH</text>
<text x="34" y="72" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#eaf1fb">Linear Regression (Scratch)</text>
<rect x="398" y="16" width="68" height="22" rx="11" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".6"/><text x="432" y="31" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.2" fill="#fbbf24">&#x2B50; 2</text>
<text x="34" y="100" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">Vectorized gradient descent, normal equations,</text>
<text x="34" y="121" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">and analytical loss optimization implemented</text>
<text x="34" y="142" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">purely in NumPy without high-level ML libraries.</text>
<rect x="34" y="154" width="70" height="24" rx="12" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="69" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">NumPy</text>
<rect x="112" y="154" width="85" height="24" rx="12" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="154" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Vectorized</text>
<rect x="205" y="154" width="95" height="24" rx="12" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="252" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Grad Descent</text>
</svg>
