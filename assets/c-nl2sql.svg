<svg xmlns="http://www.w3.org/2000/svg" width="490" height="200" viewBox="0 0 490 200" role="img" aria-label="NL-to-SQL Agent (Thesis Site): Interactive defense site for a Master's thesis on an NL-to-SQL agent: multilingual intent routing, read-only security layers, auto-repair loop."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101f3b"/><stop offset="1" stop-color="#0a1428"/></linearGradient>
<radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#60a5fa" stop-opacity=".35"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b3257"/></pattern>
<clipPath id="cl"><rect width="490" height="200" rx="16"/></clipPath></defs>
<g clip-path="url(#cl)"><rect width="490" height="200" fill="url(#bg)"/><rect width="490" height="200" fill="url(#dots)" opacity=".7"/>
<ellipse cx="450" cy="200" rx="230" ry="130" fill="url(#gl)"><animate attributeName="rx" values="200;270;200" dur="5s" repeatCount="indefinite"/></ellipse>
<rect x="0" y="0" width="490" height="3" fill="#60a5fa" opacity=".9"/>
<rect x="-200" y="0" width="200" height="200" fill="url(#sw)" transform="skewX(-20)"><animate attributeName="x" values="-200;790" dur="9s" begin="2.1s" repeatCount="indefinite"/></rect></g>
<rect x=".75" y=".75" width="488.5" height="198.5" rx="15.5" fill="none" stroke="#60a5fa" stroke-opacity=".35" stroke-width="1.5"/>
<text x="34" y="40" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#60a5fa">AI &amp; DATA</text>
<text x="34" y="72" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#eaf1fb">NL-to-SQL Agent (Thesis Site)</text>
<rect x="398" y="16" width="68" height="22" rx="11" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".6"/><circle cx="413" cy="27" r="3.6" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="422" y="31" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.2" fill="#34d399">LIVE</text><text x="34" y="100" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">Interactive defense site for a Master's thesis on an</text><text x="34" y="121" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">NL-to-SQL agent: multilingual intent routing, read-</text><text x="34" y="142" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">only security layers, auto-repair loop.</text><rect x="34" y="154" width="70" height="24" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".5"/><text x="69" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Next.js</text><rect x="112" y="154" width="85" height="24" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".5"/><text x="155" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">NL to SQL</text><rect x="205" y="154" width="99" height="24" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".5"/><text x="255" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Thesis demo</text></svg>