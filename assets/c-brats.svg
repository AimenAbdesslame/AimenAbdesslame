<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Multi-Task Brain Tumor Diagnosis on BraTS20: Dual-head U-Net for joint 3D MRI segmentation and grade classification on BraTS 2020. Kendall uncertainty loss weighting, PCGrad gradient surgery, -41% latency speedup (5.3ms/slice), 0.726 Dice, 0.962 ROC-AUC. Shipped as a production clinical web app with FastAPI, Docker, and React."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101f3b"/><stop offset="1" stop-color="#0a1428"/></linearGradient>
<radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#34d399" stop-opacity=".35"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b3257"/></pattern>
<clipPath id="cl"><rect width="1000" height="200" rx="16"/></clipPath></defs>
<g clip-path="url(#cl)"><rect width="1000" height="200" fill="url(#bg)"/><rect width="1000" height="200" fill="url(#dots)" opacity=".7"/>
<ellipse cx="960" cy="200" rx="230" ry="130" fill="url(#gl)"><animate attributeName="rx" values="200;270;200" dur="5s" repeatCount="indefinite"/></ellipse>
<rect x="0" y="0" width="1000" height="3" fill="#34d399" opacity=".9"/>
<rect x="-200" y="0" width="200" height="200" fill="url(#sw)" transform="skewX(-20)"><animate attributeName="x" values="-200;1300" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect></g>
<rect x=".75" y=".75" width="998.5" height="198.5" rx="15.5" fill="none" stroke="#34d399" stroke-opacity=".35" stroke-width="1.5"/>
<text x="34" y="40" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#34d399">MEDICAL AI &amp; COMPUTER VISION  /  SOLO RESEARCH LEAD</text>
<text x="34" y="72" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#eaf1fb">Multi-Task Brain Tumor Diagnosis on BraTS20</text>
<rect x="908" y="16" width="68" height="22" rx="11" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".6"/><circle cx="923" cy="27" r="3.6" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="932" y="31" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.2" fill="#34d399">LIVE</text>
<text x="34" y="100" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">Dual-head U-Net for joint 3D MRI segmentation &amp; grade classification on BraTS 2020 (T1, T1ce, T2, FLAIR).</text><text x="34" y="121" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">Kendall uncertainty weighting, PCGrad gradient surgery: 0.726 Dice, 0.962 ROC-AUC, 5.3 ms/slice (-41% latency).</text><text x="34" y="142" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa0bd">Shipped as a production full-stack clinical application with FastAPI backend, Docker, W&amp;B, and React.</text>
<rect x="34" y="154" width="80" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="74" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">PyTorch</text>
<rect x="122" y="154" width="130" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="187" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Dual-Head U-Net</text>
<rect x="260" y="154" width="125" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="322" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">PCGrad Surgery</text>
<rect x="393" y="154" width="145" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="465" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Kendall Uncertainty</text>
<rect x="546" y="154" width="80" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="586" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">FastAPI</text>
<rect x="634" y="154" width="70" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="669" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">Docker</text>
<rect x="712" y="154" width="60" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="742" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">W&amp;B</text>
<rect x="780" y="154" width="65" height="24" rx="12" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="812" y="170" text-anchor="middle" font-family="'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#eaf1fb">React</text>
</svg>
